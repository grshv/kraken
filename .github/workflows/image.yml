name: Image
# Assembles the panel image from the web bundle, the Go binary, Pebble and the
# pinned Squid image, natively on amd64 and arm64; runs the integration tests
# on real Squid and scans the image SBOM. On main and v* tags the tested
# images go to GHCR as one multi-arch tag, but only after the Go and web
# tests of the same commit pass, and with signed provenance and SBOM
# attestations. Runs only when the image changes.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: &paths
      - "src/**"
      - "!src/prototype/**"
      - "deploy/**"
      - "!deploy/squid/**"
      - "Makefile"
      - ".github/workflows/image.yml"
      - ".github/workflows/go.yml"
      - ".github/workflows/web.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  CACHE_IMAGE: ghcr.io/${{ github.repository }}-buildcache
  PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
jobs:
  go:
    uses: ./.github/workflows/go.yml
  web:
    uses: ./.github/workflows/web.yml
    with:
      skip_prototype: true
  build:
    name: build-${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Without a login the build still runs, only without the layer cache.
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true
      - name: Squid image signed by squid.yml
        # The pinned Squid must carry the provenance of this repository's
        # squid.yml: a digest from anywhere else is refused before the build.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          squid=$(sed -n 's/^ARG SQUID_IMAGE=//p' deploy/Dockerfile)
          test -n "$squid"
          gh attestation verify "oci://$squid" --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/squid.yml"
      - name: Build image
        # All stages are cached per architecture in the registry (public
        # packages); main and tags refresh the cache.
        run: |
          docker buildx create --name kraken --driver docker-container --use >/dev/null
          cache="$CACHE_IMAGE:${{ matrix.arch }}"
          to=()
          if [ "$PUBLISH" = true ]; then
            to=(--cache-to "type=registry,ref=$cache,mode=max,image-manifest=true,oci-mediatypes=true")
          fi
          docker buildx build --progress=plain --cache-from "type=registry,ref=$cache" "${to[@]}" \
            --load -t kraken:dev --label org.opencontainers.image.revision=${{ github.sha }} \
            -f deploy/Dockerfile .
      - name: Integration tests on real Squid
        run: make integration
      - name: Image SBOM and vulnerability scan
        run: make scan-sbom
      - name: Keep SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.arch }}
          path: dist/scan/sbom.cdx.json
          if-no-files-found: error
      # The per-arch tag is an intermediate: users pull the multi-arch tags
      # that the publish job creates only after the Go and web tests pass.
      - name: Push per-arch image
        id: push
        if: env.PUBLISH == 'true'
        run: |
          ref="$REGISTRY_IMAGE:sha-${GITHUB_SHA::12}-${{ matrix.arch }}"
          docker tag kraken:dev "$ref"
          docker push "$ref" | tee push.log
          digest=$(sed -n 's/.*digest: \(sha256:[a-f0-9]\{64\}\).*/\1/p' push.log | tail -n1)
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest the SBOM of the per-arch image
        if: env.PUBLISH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: dist/scan/sbom.cdx.json
          push-to-registry: true
          create-storage-record: false
  publish:
    needs: [go, web, build]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Multi-arch tags
        id: tags
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          sha="sha-${GITHUB_SHA::12}"
          tags=(-t "$REGISTRY_IMAGE:$sha")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=(-t "$REGISTRY_IMAGE:${GITHUB_REF_NAME#v}" -t "$REGISTRY_IMAGE:latest")
          else
            tags+=(-t "$REGISTRY_IMAGE:main")
          fi
          docker buildx imagetools create "${tags[@]}" "$REGISTRY_IMAGE:$sha-amd64" "$REGISTRY_IMAGE:$sha-arm64"
          docker buildx imagetools inspect "$REGISTRY_IMAGE:$sha"
          digest=$(docker buildx imagetools inspect "$REGISTRY_IMAGE:$sha" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance of the multi-arch image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.tags.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
