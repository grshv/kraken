name: Web
# Frontend (src/web) and the UI prototype (src/prototype): build, unit tests
# and an audit of production npm dependencies. Runs only when they change.
on:
  push:
    branches: [main]
    paths: &paths
      - "src/web/**"
      - "!src/web/*.go"
      - "src/prototype/**"
      - "docs/product/prototype/kraken-ui.html"
      - ".github/workflows/web.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:
  # image.yml calls this workflow for the web bundle only: the panel image is
  # published after it. The prototype is not shipped in the image.
  workflow_call:
    inputs:
      skip_prototype:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # A call from image.yml runs under the caller's name, so it does not cancel
  # the standalone run of the same commit.
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm --prefix src/web ci --no-audit --no-fund
      - name: Typecheck and build (with CSP style hashes)
        run: npm --prefix src/web run build
      - run: npm --prefix src/web test
      - name: Audit production dependencies
        run: npm --prefix src/web audit --omit=dev --audit-level=high
  prototype:
    if: ${{ !inputs.skip_prototype }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: src/prototype/package-lock.json
      - run: npm --prefix src/prototype ci --no-audit --no-fund
      - name: Typecheck and standalone HTML
        run: npm --prefix src/prototype run build
      - run: npm --prefix src/prototype test
      - name: Committed kraken-ui.html matches the sources
        run: git diff --exit-code -- docs/product/prototype/kraken-ui.html
