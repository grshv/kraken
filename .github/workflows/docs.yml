name: Documentation
# Links, ADR registry, docs map, OpenAPI, the policy example and help
# articles (src/tools/docs-check). Runs only when documentation changes.
on:
  push:
    branches: [main]
    paths: &paths
      - "**.md"
      - "docs/**"
      - "api/**"
      - "examples/**"
      - "src/internal/help/**"
      - "src/tools/docs-check/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Check documentation and contracts
        run: |
          make docs-check
          git diff --check
