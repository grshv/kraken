name: squid-control
services:
  squid-control:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: squid-control:dev
    ports:
      - "${SC_MANAGEMENT_BIND:-127.0.0.1}:8443:8443"
      - "${SC_PROXY_BIND:-127.0.0.1}:3128:3128"
    environment:
      SC_PUBLIC_ORIGIN: ${SC_PUBLIC_ORIGIN:-https://localhost:8443}
    volumes:
      - control-data:/data
    restart: unless-stopped
    stop_grace_period: 110s
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  control-data:
