name: kraken
services:
  kraken:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: kraken:dev
    ports:
      - "${KRAKEN_MANAGEMENT_BIND:-127.0.0.1}:8443:8443"
      - "${KRAKEN_PROXY_BIND:-127.0.0.1}:3128:3128"
    environment:
      KRAKEN_PUBLIC_ORIGIN: ${KRAKEN_PUBLIC_ORIGIN:-https://localhost:8443}
    volumes:
      - control-data:/var/lib/kraken
    restart: unless-stopped
    stop_grace_period: 160s
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  control-data:
