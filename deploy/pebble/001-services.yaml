summary: Squid Control appliance
services:
  squid:
    override: replace
    summary: Local Squid behind recovery gate
    command: /usr/local/bin/squid-control squid-start
    startup: enabled
    user: proxy
    group: proxy
    on-success: restart
    on-failure: restart
    kill-delay: 10s
  control:
    override: replace
    summary: HTTPS panel with embedded UI
    # ADR 0015 wants the panel running as user sccontrol / group sccontrol with
    # the proxy supplementary group so it can read shared logs and cache.log.
    # Pebble 1.33.2 sets the service credential via syscall.Credential which
    # triggers Go exec's setgroups(nil), clearing supplementary groups; the
    # pure-Go user lookup also bypasses /etc/group. setpriv drops to sccontrol
    # and initialises supplementary groups from NSS before exec'ing the panel.
    command: /usr/bin/setpriv --reuid=sccontrol --regid=sccontrol --init-groups -- /usr/local/bin/squid-control serve
    startup: enabled
    on-success: restart
    on-failure: restart
    kill-delay: 150s
