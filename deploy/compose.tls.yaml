services:
  kraken:
    environment:
      KRAKEN_PROXY_CERT: /run/secrets/proxy.crt
      KRAKEN_PROXY_KEY: /run/secrets/proxy.key
    ports:
      - "${KRAKEN_PROXY_BIND:-127.0.0.1}:3129:3129"
    volumes:
      - "${KRAKEN_PROXY_CERT_FILE:?Set absolute certificate path}:/run/secrets/proxy.crt:ro"
      - "${KRAKEN_PROXY_KEY_FILE:?Set absolute key path}:/run/secrets/proxy.key:ro"
