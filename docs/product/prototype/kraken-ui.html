/* Layout: inspector-first app — labeled rail · list pane · inspector; draft tray at the bottom; review sheet on the right.
   Tokens follow shadcn/ui v4 "neutral"; chart series: dataviz reference slot 1 (blue) and slot 8 (red). */
:root{
  --fs-micro:11px;--fs-meta:12px;--fs-body:13px;--fs-title:14px;--fs-page:20px;
  --bg:#f7f7f8;--fg:#18181b;--card:#fcfcfd;--muted:#eeeef0;--muted-fg:#6b6b75;--border:#e3e3e8;--input:#d9d9df;
  --sidebar:#f0f0f2;--primary:#0f766e;--primary-fg:#ffffff;--accent:#0f766e;--accent-soft:#0f766e14;--ring:#0f766e80;--hover:#ececef;--sel:#e6e6ea;--overlay:#18181b52;
  --s-allow:#0d9488;--s-deny:#dc4b4b;--s-allow-soft:#0d94881f;
  --ok:#15803d;--ok-bg:#ecfdf3;--warn:#a16207;--warn-bg:#fef9e7;--bad:#b91c1c;--bad-bg:#fdf0f0;--info-bg:#eef6f6;--info:#0f766e;
  --add-bg:#e9f9ef;--add-fg:#166534;--mod-bg:#fdf6e3;--mod-fg:#92400e;--del-bg:#fdf0f0;--del-fg:#991b1b;
  --page:#e2e2e6;--r:10px;
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --sidebar:#121214;--primary:#2dd4bf;--primary-fg:#042f2e;--accent:#2dd4bf;--accent-soft:#2dd4bf1a;--ring:#2dd4bf80;--hover:#232327;--sel:#2a2a2f;--overlay:#000000a0;
  --s-allow:#2dd4bf;--s-deny:#f07070;--s-allow-soft:#2dd4bf21;
  --ok:#4ade80;--ok-bg:#052e1666;--warn:#facc15;--warn-bg:#4220064d;--bad:#f87171;--bad-bg:#450a0a66;--info-bg:#0b2f2c80;--info:#5eead4;
  --add-bg:#052e16;--add-fg:#86efac;--mod-bg:#3b2006;--mod-fg:#fcd34d;--del-bg:#3f0b0b;--del-fg:#fca5a5;
  --page:#0b0b0c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161618;--fg:#ececef;--card:#1c1c1f;--muted:#28282c;--muted-fg:#a0a0aa;--border:#ffffff14;--input:#ffffff21;

  --s-allow:#2dd4bf;--s-deny:#f07070;--s-allow-soft:#2dd4bf21;
  --ok:#4ade80;--ok-bg:#052e1666;--warn:#facc15;--warn-bg:#4220064d;--bad:#f87171;--bad-bg:#450a0a66;--info-bg:#0b2f2c80;--info:#5eead4;
  --add-bg:#052e16;--add-fg:#86efac;--mod-bg:#3b2006;--mod-fg:#fcd34d;--del-bg:#3f0b0b;--del-fg:#fca5a5;

.logo{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none}
.logo svg.i{width:27px;height:27px}
 .logo{background:none;color:var(--accent);width:34px;height:34px}
 .logo svg.i{width:30px;height:30px}
:root{--bg:#f7f7f7;--card:#fdfdfd;--muted:#efefef;--muted-fg:#6b6b6b;--border:#e4e4e4;--input:#d9d9d9;--sidebar:#f1f1f1;--hover:#ececec;--sel:#e5e5e5;--fg:#171717;--primary:#262626;--primary-fg:#fafafa;--accent:#262626;--accent-soft:#26262617;--ring:#26262680;--page:#e3e3e3;--s-allow:#525252;--s-allow-soft:#52525224;--logo-a:#262626;--logo-b:#262626;--info:#262626;--info-bg:#2626260d;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--card:#1c1c1c;--muted:#282828;--muted-fg:#a3a3a3;--border:#ffffff14;--input:#ffffff21;--sidebar:#121212;--hover:#222222;--sel:#2a2a2a;--fg:#ededed;--primary:#e5e5e5;--primary-fg:#171717;--accent:#e5e5e5;--accent-soft:#e5e5e517;--ring:#e5e5e580;--page:#0b0b0b;--s-allow:#a3a3a3;--s-allow-soft:#a3a3a324;--logo-a:#e5e5e5;--logo-b:#e5e5e5;--info:#e5e5e5;--info-bg:#e5e5e50d;}}
:root[data-theme="dark"]{--bg:#161616;--card:#1c1c1c;--muted:#282828;--muted-fg:#a3a3a3;--border:#ffffff14;--input:#ffffff21;--sidebar:#121212;--hover:#222222;--sel:#2a2a2a;--fg:#ededed;--primary:#e5e5e5;--primary-fg:#171717;--accent:#e5e5e5;--accent-soft:#e5e5e517;--ring:#e5e5e580;--page:#0b0b0b;--s-allow:#a3a3a3;--s-allow-soft:#a3a3a324;--logo-a:#e5e5e5;--logo-b:#e5e5e5;--info:#e5e5e5;--info-bg:#e5e5e50d;}
.top.grid5{display:grid;grid-template-columns:72px var(--list-w,300px) minmax(0,1fr) minmax(0,520px) minmax(0,1fr);gap:0;padding:0 14px 0 0}
.top.grid5 .logo-cell{display:flex;justify-content:center}
.top.grid5 .name-cell{display:flex;align-items:center;gap:8px;padding-left:12px;min-width:0}
.top.grid5 .search-cell{grid-column:4}
.top.grid5 .stat-cell{grid-column:5;display:flex;justify-content:flex-end}
@media (max-width:1180px){.top.grid5{grid-template-columns:72px min(var(--list-w,300px),260px) minmax(0,.4fr) minmax(0,520px) minmax(0,1fr)}}
@media (max-width:820px){.top.grid5{grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;padding:0 14px}.top.grid5 .search-cell{grid-column:3}.top.grid5 .stat-cell{grid-column:4}.top.grid5>.gap{display:none}}
.word{color:var(--fg);white-space:nowrap}
.word{font-weight:600;font-size:var(--fs-meta);letter-spacing:.24em;text-transform:uppercase}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--fg);font-family:var(--font);font-size:var(--fs-body);line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:var(--fs-meta)}.num{font-variant-numeric:tabular-nums}
.mut{color:var(--muted-fg)}.sm{font-size:var(--fs-meta)}.xs{font-size:var(--fs-meta)}.m{font-weight:500}.b{font-weight:600}
.row{display:flex;align-items:center;gap:8px;min-width:0}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:14px;height:14px}

.intro{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-start;margin-bottom:12px}
.intro h1{font-size:var(--fs-title);margin:0 0 2px;font-weight:600}.intro p{margin:0;color:var(--muted-fg);max-width:64ch}
.try{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.try b{font-size:var(--fs-meta);color:var(--muted-fg);font-weight:500;margin-right:4px}
.seg{display:inline-flex;background:var(--muted);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted-fg);font-size:var(--fs-body);padding:4px 10px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px #0000001f}

.frame{position:relative;background:var(--bg);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px #0000000d,0 8px 24px #0000000a;height:820px;display:flex;flex-direction:column}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);min-width:0}
.ch{padding:12px 14px 4px;display:flex;align-items:flex-start;gap:8px}.ct{font-weight:600;font-size:var(--fs-title)}.cd{color:var(--muted-fg);font-size:var(--fs-meta)}
.cb{padding:8px 14px 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--input);background:var(--bg);font-size:var(--fs-body);font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}.btn.pri{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}.btn.pri:hover{opacity:.9}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--hover)}
.btn.xs{height:26px;padding:0 8px;font-size:var(--fs-meta);border-radius:6px}.btn.icon{width:32px;padding:0}.btn.icon.xs{width:26px}.btn.dashed{border-style:dashed}
.btn.danger{color:var(--bad)}
.btn:focus-visible,.seg button:focus-visible,.rail-i:focus-visible,.li:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:6px;border:1px solid var(--border);font-size:var(--fs-meta);font-weight:500;white-space:nowrap;color:var(--fg)}
.badge.sec{background:var(--muted);border-color:transparent}.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}.badge.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.badge.add{background:var(--add-bg);color:var(--add-fg);border-color:transparent}.badge.mod{background:var(--mod-bg);color:var(--mod-fg);border-color:transparent}
.badge.del{background:var(--del-bg);color:var(--del-fg);border-color:transparent}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;border-radius:6px;background:var(--muted);font-family:var(--mono);font-size:var(--fs-meta);white-space:nowrap}
.kbd{font-family:var(--mono);font-size:var(--fs-micro);border:1px solid var(--border);border-radius:6px;padding:0 4px;color:var(--muted-fg);background:var(--muted)}
.sep{height:1px;background:var(--border)}
.input,input.in,select.in,textarea.in{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--input);border-radius:8px;background:var(--bg);font-size:var(--fs-body);min-width:0;width:100%}
.input{color:var(--muted-fg);cursor:text}
textarea.in{height:auto;padding:8px 10px;font-family:var(--mono);font-size:var(--fs-meta);resize:vertical}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:var(--fs-body);font-weight:500}
.help{font-size:var(--fs-meta);color:var(--muted-fg)}
.err{font-size:var(--fs-meta);color:var(--bad)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sw{position:relative;width:34px;height:20px;border-radius:999px;background:var(--input);border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--bg);box-shadow:0 1px 2px #0003;transition:left .15s}
.sw[aria-checked="true"]{background:var(--primary)}.sw[aria-checked="true"]::after{left:16px}
.opt{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;align-items:start}
.opt.on{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.radio{width:16px;height:16px;border-radius:50%;border:1px solid var(--input);margin-top:1px;display:grid;place-items:center}
.opt.on .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--fg)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.callout{display:flex;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid transparent;align-items:flex-start}
.callout.bad{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 25%,transparent)}
.callout.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.callout.info{background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 20%,transparent)}
.callout .ic{margin-top:1px}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--muted-fg);font-size:var(--fs-meta);height:34px;padding:0 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:hover{background:var(--hover)}tbody tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
tr.add td:first-child{box-shadow:inset 3px 0 0 var(--add-fg)}tr.mod td:first-child{box-shadow:inset 3px 0 0 var(--mod-fg)}tr.del td{text-decoration:line-through;color:var(--muted-fg)}tr.del td:first-child{box-shadow:inset 3px 0 0 var(--del-fg)}
tr.dim td{color:var(--muted-fg)}
.bar{height:6px;border-radius:3px;background:var(--muted);overflow:hidden;min-width:50px}.bar>i{display:block;height:100%;background:var(--s-allow);border-radius:3px}.bar>i.d{background:var(--s-deny)}

/* app shell */
.top{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;border-bottom:1px solid var(--border);flex:none}
.brand{display:flex;align-items:center;gap:9px;width:208px}

.status{display:flex;align-items:center;gap:8px;font-size:var(--fs-body)}
.body{flex:1;display:grid;grid-template-columns:72px var(--list-w,300px) minmax(0,1fr);min-height:0}
.body.wide{grid-template-columns:72px minmax(0,1fr)}
.rail{background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;overflow-y:auto}
.rail-i{width:64px;padding:7px 0 6px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted-fg);font-size:var(--fs-micro);font-weight:500;position:relative}
.rail-i:hover{background:var(--hover);color:var(--fg)}.rail-i.on{background:var(--accent-soft);color:var(--accent)}
.avatar{position:relative;width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--muted);color:var(--fg);font-weight:500;font-size:var(--fs-body);cursor:pointer;margin:6px 0 4px;flex:none}
.avatar:hover,.avatar.on{border-color:var(--ring)}
.avatar .online{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--sidebar)}
.menu{position:absolute;left:80px;bottom:60px;z-index:25;width:280px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 32px #00000033;padding:6px}
.menu .mh{display:flex;gap:10px;align-items:center;padding:8px 8px 10px}
.menu .mi{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 8px;border:0;background:transparent;border-radius:6px;cursor:pointer;text-align:left;font-size:var(--fs-body)}
.menu .mi:hover,.menu .mi:focus-visible{background:var(--hover);outline:none}
.menu .mi.danger{color:var(--bad)}
.menu .sep{margin:4px 0}
.avatar:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.health{position:relative}
.health .htip{display:none;position:absolute;top:34px;right:0;z-index:15;width:340px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px #00000026;padding:10px 12px}
.health:hover .htip,.health:focus-within .htip,.health.open .htip{display:block}
.rail-i .n{position:absolute;top:3px;right:9px;min-width:15px;height:15px;border-radius:8px;background:var(--mod-bg);color:var(--mod-fg);font-size:var(--fs-micro);display:grid;place-items:center;padding:0 3px}
.list{border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0;min-height:0}
.lh{padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--border)}
.lb{overflow-y:auto;flex:1}
.lg{padding:10px 14px 4px;font-size:var(--fs-meta);color:var(--muted-fg);font-weight:500}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 8px;padding:9px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.li:hover{background:var(--hover)}.li.on{background:var(--sel);box-shadow:inset 2px 0 0 var(--accent)}
.li>*{min-width:0}.li:not([style])>:nth-child(2n){white-space:nowrap;text-align:right;justify-self:end}
.li:not([style])>:nth-child(1),.li:not([style])>:nth-child(3){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.insp{display:flex;flex-direction:column;min-width:0;min-height:0}
.ih{padding:14px 20px 10px;display:flex;flex-direction:column;gap:6px;flex:none}
.pt{font-size:var(--fs-page);font-weight:600;letter-spacing:-.015em;margin:0}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--border);padding:0 20px;flex:none;overflow-x:auto}
.tab{padding:9px 0;color:var(--muted-fg);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab.on{color:var(--fg);border-color:var(--accent)}
.ib{padding:16px 20px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.kpis>.kpi{border:0;border-radius:0;background:transparent;border-left:1px solid var(--border);padding:10px 14px;min-width:0}.kpis>.kpi:first-child{border-left:0}

function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p;}
function traffic(id,data,h=150){
  const n=data.length,maxA=niceMax(Math.max(...data.map(s=>s.a))),maxD=niceMax(Math.max(1,...data.map(s=>s.d)));const W=1000,H=100;
  let line='';data.forEach((s,i)=>{line+=(i?'L':'M')+(i/(n-1)*W).toFixed(1)+','+(H-s.a/maxA*H).toFixed(1);});
  const bw=W/n;const bars=data.map((s,i)=>{const bh=s.d/maxD*H;return bh?`<rect x="${(i*bw+1).toFixed(1)}" y="${(H-bh).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5" fill="var(--s-deny)"/>`:''}).join('');
  const grid=v=>[0,.5,1].map(f=>`<div class="grid" style="top:${(1-f)*100}%"></div><div class="yl num" style="top:${(1-f)*100}%">${fmt(Math.round(v*f))}</div>`).join('');
  const xt=[0,16,32,48,64,80,95].map(i=>`<div class="xl" style="left:${i/(n-1)*100}%;${i===95?'transform:translateX(-100%)':''}">${tlabel(i)}</div>`).join('');
  TR[id]=data;
  return `<div data-chart="${id}" style="position:relative;padding:2px 2px 22px 44px">
   <div class="legend" style="margin-bottom:6px"><span><i class="swc" style="background:var(--s-allow)"></i>Разрешено, запросов за 15 мин</span></div>
   <div class="chart" style="height:${h}px">${grid(maxA)}<svg class="plot" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${line}L${W},${H}L0,${H}Z" fill="var(--s-allow-soft)"/><path d="${line}" fill="none" stroke="var(--s-allow)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></div>
   <div class="legend" style="margin:12px 0 6px"><span><i class="swc" style="background:var(--s-deny)"></i>Отказы, за 15 мин</span></div>
   <div class="chart" style="height:40px">${grid(maxD)}<svg class="plot" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${bars}</svg>${xt}</div></div>`;
}
const TR={};
function bindCharts(root){root.querySelectorAll('[data-chart]').forEach(el=>{const data=TR[el.dataset.chart];if(!data)return;const charts=el.querySelectorAll('.chart');const n=data.length;
  const tip=document.createElement('div');tip.className='tip';tip.hidden=true;el.appendChild(tip);const cross=[...charts].map(c=>{const d=document.createElement('div');d.className='cross';d.hidden=true;c.appendChild(d);return d;});
  el.addEventListener('mousemove',e=>{const r=charts[0].getBoundingClientRect();const f=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));const i=Math.round(f*(n-1));const s=data[i];
   cross.forEach(d=>{d.hidden=false;d.style.left=(i/(n-1)*100)+'%';});tip.hidden=false;
   tip.innerHTML=`<div class="mut" style="margin-bottom:4px">${tlabel(i)}–${tlabel(i+1)}</div><div class="tr"><i class="swc" style="background:var(--s-allow)"></i>Разрешено<b>${fmt(s.a)}</b></div><div class="tr"><i class="swc" style="background:var(--s-deny)"></i>Отказы<b>${fmt(s.d)}</b></div>`;
   const er=el.getBoundingClientRect();let lx=e.clientX-er.left+14;if(lx+170>er.width)lx-=190;tip.style.left=lx+'px';tip.style.top='24px';});
  el.addEventListener('mouseleave',()=>{tip.hidden=true;cross.forEach(d=>d.hidden=true);});});}
function spark(v,w=56,h=18,color='var(--s-allow)'){const m=Math.max(1,...v),n=v.length,bw=w/n;if(v.every(x=>!x))return `<svg class="spark" width="${w}" height="${h}"><line x1="0" y1="${h-1}" x2="${w}" y2="${h-1}" stroke="var(--border)" stroke-width="2"/></svg>`;
 return `<svg class="spark" width="${w}" height="${h}" aria-hidden="true">${v.map((x,i)=>{const bh=Math.max(1.5,x/m*(h-2));return `<rect x="${(i*bw+.4).toFixed(1)}" y="${(h-bh).toFixed(1)}" width="${(bw-1.2).toFixed(1)}" height="${bh.toFixed(1)}" rx="1" fill="${color}" opacity="${i===n-1?1:.55}"/>`;}).join('')}</svg>`;}
function hist(){seed=31;const v=Array.from({length:60},(_,i)=>({a:Math.round(110+60*rnd()+(i>40?30:0)),d:Math.round(rnd()*4+(i>45?6*rnd():0))}));const m=Math.max(...v.map(x=>x.a+x.d));const W=600,H=60,bw=W/60;
 return `<div class="chart" style="height:50px"><svg class="plot" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${v.map((x,i)=>{const ha=x.a/m*H,hd=x.d/m*H;return `<rect x="${i*bw+1}" y="${H-ha}" width="${bw-2}" height="${ha}" rx="1" fill="var(--s-allow)" opacity=".7"/>${hd?`<rect x="${i*bw+1}" y="${H-ha-hd-1.5}" width="${bw-2}" height="${hd}" rx="1" fill="var(--s-deny)"/>`:''}`;}).join('')}</svg>${['13:03','13:18','13:33','13:48','14:02'].map((t,i)=>`<div class="xl" style="left:${i*25}%;${i===0?'transform:none':i===4?'transform:translateX(-100%)':''}">${t}</div>`).join('')}</div>`;}

}

function allow(cid,dom,){const c=C(cid);const p=PO(c.pol);if(!p||p.mode!=='list')return;
  const d=dom.split(':')[0];if(p.dom.some(x=>x.d===d)){toast('Уже в политике');return;}
  p.dom.push({d,s:0,h:0,isnew:1});const den=D.denied[cid];if(den){D.denied[cid]=den.filter(x=>x.d!==dom);}
  addChange({k:'a',t:`${p.own?c.name:p.name}: ${d}`,d:p.own?`Разрешить ${c.name}`:`Затронет: ${usersOf(p.id).map(x=>x.name).join(', ')}`,ref:'dom:'+d});}
function handle(t){
  const a=t.dataset.act;
  if(t.dataset.nav){S.nav=t.dataset.nav;S.newc=null;if(t.dataset.aud!==undefined)S.aud=+t.dataset.aud;if(t.dataset.accMe!==undefined)S.acc='admin';}
  else if(t.dataset.sel){S.nav='clients';S.sel=t.dataset.sel;S.newc=null;S.tab='overview';}
  else if(t.dataset.tab){S.tab=t.dataset.tab;}
  else if(t.dataset.pol){S.pol=t.dataset.pol;}
  else if(t.dataset.set){S.set=t.dataset.set;}
  else if(t.dataset.acc){S.acc=t.dataset.acc;S.nav='accounts';S.me=false;}
  else if(t.dataset.log){S.logSel=+t.dataset.log;}
  else if(t.dataset.doc){S.doc=t.dataset.doc;}

// unified router for new actions; falls back to the base handler
function route(t){
  const a=t.dataset.act;
  if(t.dataset.doc&&t.dataset.nav){S.doc=t.dataset.doc;S.nav='help';return render();}
  if(t.dataset.set&&t.dataset.nav){S.nav='settings';S.set=t.dataset.set;S.hopen=false;return render();}
  if(a==='discard'){S.confirm={title:'Отменить все изменения?',text:`Черновик (${cnt(S.draft.length,'изменение','изменения','изменений')}) будет удалён. Работающая конфигурация не изменится.`,ok:'Отменить изменения',danger:true,act:'do-discard'};return render();}
  if(a==='toggle-client'){const c=C(S.sel);if(c.on&&c.req){S.confirm={title:`Отключить ${c.name}?`,text:`За 24 ч у клиента ${fmt(c.req)} запросов, сейчас открыто ${cnt(c.tun,'соединение','соединения','соединений')}. После применения все новые запросы получат отказ.`,ok:'Отключить',danger:true,act:'do-toggle'};return render();}return handle(t);}
  if(a==='block-user'){const u=t.dataset.u;S.confirm={title:`Заблокировать ${u}?`,text:'Активные сессии завершатся сразу. Имя останется в аудите.',ok:'Заблокировать',danger:true,act:'do-block',u};return render();}
  if(a==='confirm-no'){S.confirm=null;return render();}
  if(a==='confirm-yes'){const c=S.confirm;S.confirm=null;
    if(c.act==='do-discard'){S.draft=[];D.policies.forEach(p=>p.dom=p.dom.filter(x=>!x.isnew).map(x=>({...x,del:0})));D.blocked=D.blocked.filter(x=>!x.isnew);toast('Черновик очищен');}
    if(c.act==='do-toggle'){const cl=C(S.sel);cl.on=false;addChange({k:'m',t:`${cl.name}: отключён`,d:'Все запросы получат отказ',ref:'cl'});}
    if(c.act==='do-block'){ACC2[c.u].on=!ACC2[c.u].on;toast(ACC2[c.u].on?'Разблокирован':'Заблокирован, сессии завершены');}
    return render();}
  if(a==='refresh-draft'){S.conflict=false;S.draft.push({k:'a',t:'ci-01: registry.npmjs.org',d:'Изменение anna',ref:'dom:registry.npmjs.org',owner:'anna'});return render();}
  if(a==='review'&&S.env==='down'){toast('Squid не отвечает: применить нельзя, черновик сохранён');S.sheet=true;S.applying=-1;return render();}
  if(a==='apply'){if(!canApply())return;S.applying=0;S.applyErr=false;const tick=()=>{
      if(S.applyFail&&S.applying===1){S.applyErr=true;render();return;}
      S.applying++;if(S.applying>4){S.sheet=false;S.applying=-1;S.draft=[];S.applied=true;clearMarks();toast('Ревизия r-42 применена и подтверждена Squid');render();return;}render();setTimeout(tick,S.applying===3?900:450);};setTimeout(tick,450);return render();}
  if(a==='back-to-draft'){S.applying=-1;S.applyErr=false;return render();}
  if(a==='save-new'){const name=(document.getElementById('n-name').value||'').trim();const src=(document.getElementById('n-src').value||'').trim();S.newc.name=name;S.newc.src=src;
    const toks=src.split(/[\s,]+/).filter(Boolean);let err='';
    if(!name)err='Укажите имя клиента.';
    else if(!toks.length)err='Укажите хотя бы один адрес или сеть.';
    else{for(const tk of toks){if(ip4(tk)==null||(tk.includes('/')&&!(+tk.split('/')[1]>=8&&+tk.split('/')[1]<=32))){err=`«${tk}» не похоже на IPv4-адрес или сеть вида 10.20.0.0/24.`;break;}
      if(isMgr()&&!ME.nets.some(n=>inNet(tk,n))){err=`${tk} вне ваших сетей (${ME.nets.join(', ')}). Добавить такого клиента может администратор.`;break;}
      const hit=ALLC.find(c=>c.nets.some(n=>inNet(tk,n)));if(hit&&!S.newc.ok){err=`${tk} уже входит в клиента ${hit.name} (${hit.nets.join(', ')}). Пересечение возможно, только если у клиентов разные логины прокси. Нажмите ещё раз, чтобы сохранить с логином.`;S.newc.ok=1;break;}}}
    S.newc.err=err;if(err)return render();
    const before=ALLC.length;handle(t);if(isMgr()&&ALLC.length>before)ME.clients.push(ALLC[ALLC.length-1].id);return;}
  if(a==='new-login'){const name='ci-deploy-2';ACC2[name]={t:'proxy',on:true,owner:isMgr()?'anna':'admin',clients:[],ok:'0',bad:'0',req:'0',ips:[],pwd:'только что'};S.acc=name;toast('Логин создан. Пароль показан один раз: передайте его владельцу машины');return render();}
  if(a==='new-client'&&isMgr()&&!ME.nets.length){toast('Для вас не заданы сети: создавать клиентов может администратор');return;}
  return handle(t);
}

  document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);});
document.addEventListener('dblclick',e=>{const h=e.target.closest('.resizer');if(!h)return;const P=PANES[h.dataset.resize];document.getElementById('app').style.setProperty(P.v,P.def+'px');try{localStorage.removeItem('kraken-pane-'+h.dataset.resize);}catch(e){}});
document.addEventListener('keydown',e=>{const h=e.target.closest&&e.target.closest('.resizer');if(!h||(e.key!=='ArrowLeft'&&e.key!=='ArrowRight'))return;const k=h.dataset.resize,P=PANES[k],app=document.getElementById('app');const cur=parseInt(getComputedStyle(app).getPropertyValue(P.v))||P.def;const d=(e.key==='ArrowRight'?1:-1)*(k==='list'?1:-1)*16;app.style.setProperty(P.v,Math.min(P.max,Math.max(P.min,cur+d))+'px');e.preventDefault();});
const _route=route;route=function(t){const a=t.dataset.act;
  if(a==='more'){S.more=!S.more;return render();}
  if(S.more&&a!=='more')S.more=false;
  if(a==='del-client'){const c=C(S.sel);S.confirm={title:`Удалить ${c.name}?`,text:'Клиент исчезнет из правил после применения. История запросов и аудит сохранятся.',ok:'Удалить',danger:true,act:'do-del'};return render();}
  if(a==='confirm-yes'&&S.confirm&&S.confirm.act==='do-del'){const c=C(S.sel);S.confirm=null;addChange({k:'d',t:`Удалить клиента ${c.name}`,d:c.nets.join(', '),ref:'cl'});return render();}
  return _route(t);};

const app=document.getElementById('app');
app.addEventListener('click',e=>{if(S.me&&!e.target.closest('.menu,[data-act="me"]')){S.me=false;if(!e.target.closest('[data-act],[data-nav],[data-sel],[data-tab],[data-pol],[data-set],[data-acc],[data-log],[data-pal],[data-aud],[data-doc]'))return render();}const t=e.target.closest('[data-act],[data-nav],[data-sel],[data-tab],[data-pol],[data-set],[data-acc],[data-log],[data-pal],[data-aud],[data-doc]');if(t&&!t.disabled)route(t);});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[tabindex]'))e.target.click();if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('add-')){const b=app.querySelector(`[data-act="add-dom"][data-ctx="${e.target.id.slice(4)}"]`);if(b)handle(b);}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();S.palette=!S.palette;render();}if(e.key==='Escape'&&(S.palette||S.sheet||S.me)){S.palette=false;S.me=false;if(S.applying<0)S.sheet=false;render();}});
document.querySelector('.try').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){go(b.dataset.go);render();}});

render();fromHash();
</script>
</body></html>
